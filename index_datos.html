<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pT">Ficha Atleta - Baloncesto</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap" rel="stylesheet">
<style>
:root {
  --m: #7C2D12;   /* Naranja oscuro / Óxido corporativo */
  --e: #EA580C;   /* Naranja vibrante para baloncesto */
  --f: #FFF7ED;   /* Fondo claro cálido */
}
body {
  font-family: 'Inter', sans-serif;
  background: var(--f);
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
.b-h {
  background-image: url('img/banner.png');
  background-size: cover;
  background-position: center;
  min-height: 200px;
  width: 100%;
}
.m-c {
  background: #fffbf5;
  border-left: 4px solid var(--e);
}
</style>
</head>
<body oncontextmenu="return false">
    <div class="b-h"></div>
    <div class="container mx-auto p-4">
        <header class="mb-6 flex items-center border-b pb-4">
            <a href="index_ficha.html" class="text-gray-500 hover:text-orange-600 transition mr-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z"/></svg>
            </a>
            <h1 class="text-2xl font-black text-gray-800">Ficha: <span id="aNT" class="text-orange-600">...</span></h1>
        </header>
        <div id="aDC" class="bg-white p-6 rounded-xl shadow-lg border border-gray-100">
            <p id="lM" class="text-center py-10 text-gray-500 font-semibold italic">Verificando sesión y cargando datos...</p>
            <div id="aD" class="hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 text-sm">
                    <div><span class="font-semibold text-gray-500">Nombre:</span> <span id="nAp" class="block"></span></div>
                    <div><span class="font-semibold text-gray-500">Cédula:</span> <span id="cI" class="block"></span></div>
                    <div><span class="font-semibold text-gray-500">Teléfono:</span> <span id="tel" class="block"></span></div>
                    <div><span class="font-semibold text-gray-500">Nacimiento:</span> <span id="fNa" class="block"></span></div>
                    <div><span class="font-semibold text-gray-500">Edad:</span> <span id="eda" class="text-orange-700 font-bold block"></span></div>
                    <div><span class="font-semibold text-gray-500">Categoría:</span> <span id="cat" class="text-orange-600 font-bold block"></span></div>
                    <div><span class="font-semibold text-gray-500">Camiseta:</span> <span id="nCa" class="text-amber-600 font-black text-xl block"></span></div>
                </div>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="m-c p-4 rounded-lg"><p class="text-xs font-bold uppercase">Monto <span id="nomT"></span></p><p id="mPa" class="text-2xl font-black"></p></div>
                    <div class="m-c p-4 rounded-lg"><p class="text-xs font-bold uppercase">Último Pago</p><p id="uPa" class="text-sm font-bold mt-2"></p></div>
                    <div class="m-c p-4 rounded-lg"><p class="text-xs font-bold uppercase mb-2">Solvencia</p><span id="sSt" class="text-xs font-bold px-3 py-1 rounded-full"></span></div>
                    <div class="m-c p-4 rounded-lg"><p class="text-xs font-bold uppercase">IMC</p><p id="imc" class="text-2xl font-black"></p><span id="iSt" class="text-[10px] font-bold px-2 py-0.5 rounded uppercase"></span></div>
                    <div class="m-c p-4 rounded-lg"><p class="text-xs font-bold uppercase">Peso</p><p id="pes" class="text-2xl font-black"></p></div>
                    <div class="m-c p-4 rounded-lg"><p class="text-xs font-bold uppercase">Talla</p><p id="tal" class="text-2xl font-black"></p></div>
                    <div class="m-c p-4 rounded-lg bg-orange-50"><p class="text-xs text-orange-700 font-bold uppercase">Proyección</p><p id="tPr" class="text-2xl font-black text-orange-800"></p></div>
                </div>
            </div>
        </div>
    </div>

<script type="module">
window.addEventListener('keydown',function(e){if(e.keyCode==123||(e.ctrlKey&&e.shiftKey&&(e.keyCode==73||e.keyCode==74||e.keyCode==67))||(e.ctrlKey&&e.keyCode==85)){e.preventDefault();return false;}});

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const app = initializeApp({
    apiKey: "AIzaSyBXtzQIu0q2TrfmasOtlahQHH8IxRXt8Xg",
    authDomain: "esbalir-bc3ee.firebaseapp.com",
    projectId: "esbalir-bc3ee",
    storageBucket: "esbalir-bc3ee.firebasestorage.app",
    messagingSenderId: "679569110180",
    appId: "1:679569110180:web:9a27856b62acd717406231"
});

const auth = getAuth(app);
const db = getFirestore(app);

const calcularEdad = (fechaStr) => {
    if (!fechaStr) return '--';
    const nac = new Date(fechaStr);
    const hoy = new Date();
    let edad = hoy.getFullYear() - nac.getFullYear();
    const m = hoy.getMonth() - nac.getMonth();
    if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) {
        edad--;
    }
    return edad;
};

const urlParams = new URLSearchParams(window.location.search);
const atletaId = urlParams.get('id');
const msgElement = document.getElementById('lM');

if (!atletaId) {
    msgElement.innerHTML = `⚠️ <b class="text-red-600">Error: No se encontró el parámetro 'id' en la URL.</b>`;
} else {
    // Esperamos a que Firebase valide la sesión activa antes de consultar Firestore
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            msgElement.innerHTML = `❌ <span class="text-red-600">Sesión no detectada. Por favor vuelve a iniciar sesión.</span>`;
            return;
        }

        try {
            msgElement.innerText = "Cargando información del atleta...";
            const docRef = doc(db, 'club_athletes', atletaId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const c = docSnap.data();
                
                document.getElementById('aNT').innerText = (c.nombre || '') + ' ' + (c.apellido || '');
                document.getElementById('nAp').innerText = (c.nombre || '') + ' ' + (c.apellido || '');
                document.getElementById('cI').innerText = c.cedulaIdentidad || 'N/A';
                document.getElementById('tel').innerText = c.telefono || 'N/A';
                document.getElementById('fNa').innerText = c.fechaNacimiento || 'N/A';
                document.getElementById('eda').innerText = calcularEdad(c.fechaNacimiento) + ' años';
                document.getElementById('cat').innerText = c.categoria || 'N/A';
                document.getElementById('nCa').innerText = c.nroCamiseta || 'N/A';
                document.getElementById('nomT').innerText = c.frecuenciaPago === 'quincenal' ? '(Q)' : '(M)';
                document.getElementById('mPa').innerText = parseFloat(c.montoPago || 0).toFixed(2) + '$';
                document.getElementById('uPa').innerText = c.fechaUltimoPago || 'Sin registros';
                
                const solvente = c.fechaUltimoPago ? ((new Date() - new Date(c.fechaUltimoPago)) / 864e5 <= (c.frecuenciaPago === 'quincenal' ? 15 : 30)) : false;
                const v = solvente ? { s: 'Solvente', c: 'bg-green-500 text-white' } : { s: 'Insolvente', c: 'bg-red-500 text-white' };
                const sStEl = document.getElementById('sSt');
                sStEl.innerText = v.s;
                sStEl.className = 'text-xs font-bold px-3 py-1 rounded-full ' + v.c;

                document.getElementById('pes').innerText = (c.peso || 0) + ' kg';
                document.getElementById('tal').innerText = (c.talla || 0) + ' cm';
                
                const peso = parseFloat(c.peso || 0);
                const tallaM = parseFloat(c.talla || 0) / 100;
                const imc = (peso > 0 && tallaM > 0) ? (peso / Math.pow(tallaM, 2)) : 0;
                document.getElementById('imc').innerText = imc.toFixed(2);
                
                let g = 0;
                if (['U9', 'U11'].includes(c.categoria)) g = 15;
                else if (c.categoria === 'U13') g = 10;
                else if (c.categoria === 'U15') g = 6;
                else if (c.categoria === 'U19') g = 2;
                
                document.getElementById('tPr').innerText = (c.talla > 0) ? ((parseFloat(c.talla) + g) / 100).toFixed(2) + ' m' : 'N/A';
                
                document.getElementById('lM').classList.add('hidden');
                document.getElementById('aD').classList.remove('hidden');
            } else {
                msgElement.innerHTML = `❌ El documento con ID <code class="bg-gray-100 px-1 py-0.5 rounded">${atletaId}</code> no existe en la base de datos.`;
            }
        } catch (e) {
            console.error("Error al cargar la ficha:", e);
            msgElement.innerHTML = `❌ Error de permisos o conexión:<br><span class="text-red-500 text-xs">${e.message}</span>`;
        }
    });
}
</script>
</body>
</html>
