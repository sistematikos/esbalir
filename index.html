<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Acceso - Esbalir</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Inter', sans-serif;
  background: #0047AB !important; /* Azul eléctrico forzado */
  min-height: 100vh;
}
.pattern-bg {
  background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
  background-size: 24px 24px;
}
.banner-top {
  background-image: url('img/banner.png');
  background-size: cover;
  background-position: center;
  height: 180px;
  width: 100%;
  border-top-left-radius: 0.75rem;
  border-top-right-radius: 0.75rem;
  position: relative;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
}
@media (min-width: 640px) {
  .banner-top {
    height: 200px;
  }
}
</style>
</head>
<body class="pattern-bg flex flex-col items-center justify-center p-4" oncontextmenu="return false">

    <!-- Contenedor Principal -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden border border-white/20 my-auto">
        
        <!-- Banner superior deportivo -->
        <div class="banner-top">
            <div class="absolute top-3 left-3 z-10">
                <span class="text-white text-[10px] font-bold tracking-wider uppercase bg-amber-600 px-2.5 py-1 rounded shadow">Oficial</span>
            </div>
        </div>

        <!-- Formulario y Contenido -->
        <div class="p-8">
            <div class="text-center mb-6">
                <h1 class="text-xl font-black text-slate-900 tracking-tight">Esbalir - Escuela de Baloncesto</h1>
                <p class="text-xs text-slate-600 mt-1 font-semibold">Control de Atletas y Administración Deportiva</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Correo Electrónico</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M2.94 6.34A2 2 0 014.82 5h10.36a2 2 0 011.88 1.34L10 10.5 2.94 6.34zM2 8.12l8 4.67 8-4.67V13a2 2 0 01-2 2H4a2 2 0 01-2-2V8.12z"/>
                            </svg>
                        </span>
                        <input type="email" id="email" required placeholder="tu@correo.com" class="block w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                            </svg>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" class="block w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <button type="button" onclick="recuperarPassword()" class="text-blue-900 hover:text-amber-600 font-semibold transition focus:outline-none">¿Olvidaste tu contraseña?</button>
                </div>

                <button type="submit" id="btnSubmit" class="w-full py-3 px-4 text-white font-extrabold rounded-lg shadow-lg transition transform active:scale-95" style="background-color: #D97706;">Ingresar al Sistema</button>

                <p id="errorMsg" class="text-red-500 text-xs text-center font-medium mt-3 hidden p-2 bg-red-50 rounded border border-red-100"></p>
                <p id="successMsg" class="text-emerald-700 text-xs text-center font-medium mt-3 hidden p-2 bg-emerald-50 rounded border border-emerald-100"></p>
            </form>
        </div>
        
        <!-- Pie de tarjeta -->
        <div class="bg-slate-50 px-8 py-3 border-t border-slate-100 text-center">
            <p class="text-[11px] text-slate-400 font-medium">Sistema de Gestión Esbalir</p>
        </div>
    </div>

<script type="module">
window.addEventListener('keydown',function(e){if(e.keyCode==123||(e.ctrlKey&&e.shiftKey&&(e.keyCode==73||e.keyCode==74||e.keyCode==67))||(e.ctrlKey&&e.keyCode==85)){e.preventDefault();return false;}});

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBXtzQIu0q2TrfmasOtlahQHH8IxRXt8Xg",
  authDomain: "esbalir-bc3ee.firebaseapp.com",
  projectId: "esbalir-bc3ee",
  storageBucket: "esbalir-bc3ee.firebasestorage.app",
  messagingSenderId: "679569110180",
  appId: "1:679569110180:web:9a27856b62acd717406231"
});

const auth = getAuth(app);
const db = getFirestore(app);

function getDeviceFingerprint() {
  let deviceId = localStorage.getItem('esbalir_device_id');
  if (!deviceId) {
    deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('esbalir_device_id', deviceId);
  }
  return deviceId;
}

window.recuperarPassword = async () => {
  const email = document.getElementById('email').value.trim();
  const errEl = document.getElementById('errorMsg');
  const succEl = document.getElementById('successMsg');

  errEl.classList.add('hidden');
  succEl.classList.add('hidden');

  if (!email) {
    errEl.textContent = 'Por favor, introduce tu correo electrónico primero en el campo superior.';
    errEl.classList.remove('hidden');
    document.getElementById('email').focus();
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    succEl.textContent = '¡Correo de recuperación enviado! Revisa tu bandeja de entrada o spam.';
    succEl.classList.remove('hidden');
  } catch (err) {
    console.error("Error al enviar correo de recuperación:", err);
    let mensaje = err.message;
    if (err.code === 'auth/user-not-found') {
      mensaje = 'No existe una cuenta registrada con este correo.';
    } else if (err.code === 'auth/invalid-email') {
      mensaje = 'El formato del correo electrónico no es válido.';
    }
    errEl.textContent = 'Error: ' + mensaje;
    errEl.classList.remove('hidden');
  }
};

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('errorMsg');
  const succEl = document.getElementById('successMsg');
  const btn = document.getElementById('btnSubmit');
  
  errEl.classList.add('hidden');
  succEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Verificando acceso...';

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    if (email === 'admin@esbalir.com') {
      location.href = 'index_menu.html';
      return;
    }

    const deviceId = getDeviceFingerprint();
    const deviceDocId = `${user.uid}_${deviceId}`;
    const deviceRef = doc(db, 'authorized_devices', deviceDocId);
    
    const deviceSnap = await getDoc(deviceRef);

    if (deviceSnap.exists() && deviceSnap.data().approved === true) {
      location.href = 'index_menu.html';
    } else {
      await setDoc(deviceRef, {
        userId: user.uid,
        email: user.email,
        deviceId: deviceId,
        userAgent: navigator.userAgent,
        approved: false,
        requestedAt: new Date().toISOString()
      }, { merge: true });

      await signOut(auth);
      errEl.textContent = 'Dispositivo pendiente de aprobación por el administrador.';
      errEl.classList.remove('hidden');
    }
  } catch (err) {
    console.error("Error detallado en login:", err);
    errEl.textContent = 'Credenciales incorrectas o error de conexión.';
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar al Sistema';
  }
});
</script>
</body>
</html>
