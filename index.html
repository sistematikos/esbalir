<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Iniciar Sesión - Esbalir</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --color-azul: #1E3A8A;
  --color-mostaza: #D97706;
  --bg-claro: #F9FAFB;
}
body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-claro);
}
.banner-header {
  background-image: url('img/banner.png');
  background-size: cover;
  background-position: center;
  min-height: 250px;
  width: 100%;
}
</style>
</head>
<body>
    <div class="banner-header"></div>
    <div class="container mx-auto p-4 flex items-center justify-center min-h-[60vh]">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-100">
            <h1 class="text-2xl font-black mb-6 text-center" style="color: var(--color-azul);">Acceso al Sistema</h1>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Correo Electrónico</label>
                    <input type="email" id="email" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-3 border focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Contraseña</label>
                    <input type="password" id="password" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-3 border focus:ring-amber-500 focus:border-amber-500">
                </div>
                <button type="submit" id="btnSubmit" class="w-full py-3 px-4 text-white font-bold rounded-lg shadow-md transition" style="background-color: var(--color-mostaza);">Ingresar</button>
                <p id="errorMsg" class="text-red-500 text-sm text-center mt-2 hidden"></p>
            </form>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBXtzQIu0q2TrfmasOtlahQHH8IxRXt8Xg",
  authDomain: "esbalir-bc3ee.firebaseapp.com",
  projectId: "esbalir-bc3ee",
  storageBucket: "esbalir-bc3ee.firebasestorage.app",
  messagingSenderId: "679569110180",
  appId: "1:679569110180:web:9a27856b62acd717406231"
});

const auth = getAuth(app);
const db = getFirestore(app);

function getDeviceFingerprint() {
  let deviceId = localStorage.getItem('esbalir_device_id');
  if (!deviceId) {
    deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
    localStorage.setItem('esbalir_device_id', deviceId);
  }
  return deviceId;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('errorMsg');
  const btn = document.getElementById('btnSubmit');
  
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Verificando...';

  try {
    // 1. Autenticar con Firebase Auth
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    
    // Si eres tú (admin), pasa directo
    if (email === 'admin@esbalir.com') {
      location.href = 'index_menu.html';
      return;
    }

    // 2. Verificar dispositivo en Firestore
    const deviceId = getDeviceFingerprint();
    const deviceDocId = `${user.uid}_${deviceId}`;
    const deviceRef = doc(db, 'authorized_devices', deviceDocId);
    
    const deviceSnap = await getDoc(deviceRef);

    if (deviceSnap.exists() && deviceSnap.data().approved === true) {
      location.href = 'index_menu.html';
    } else {
      // Registrar como pendiente
      await setDoc(deviceRef, {
        userId: user.uid,
        email: user.email,
        deviceId: deviceId,
        userAgent: navigator.userAgent,
        approved: false,
        requestedAt: new Date().toISOString()
      }, { merge: true });

      await signOut(auth);
      errEl.textContent = 'Dispositivo pendiente de aprobación por el administrador.';
      errEl.classList.remove('hidden');
    }
  } catch (err) {
    console.error("Error detallado en login:", err);
    errEl.textContent = 'Error: ' + err.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ingresar';
  }
});
</script>
</body>
</html>
